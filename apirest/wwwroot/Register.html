<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Prueba Técnica</title>
    <link rel="stylesheet" href="css/Login.css">
</head>
<body>
    <div class="login-container"> <form id="register-form" class="auth-form">
            <h2>Crear Cuenta</h2>
            
            <div class="input-group">
                <label for="reg-name">Nombre Completo</label>
                <input type="text" id="reg-name" required placeholder="Tu nombre">
            </div>

            <div class="input-group">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" required placeholder="correo@ejemplo.com">
            </div>

            <div class="input-group">
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" required placeholder="Crea una contraseña">
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirmar Contraseña</label>
                <input type="password" id="confirm-password" required placeholder="Repite tu contraseña">
            </div>

            <button type="submit" id="btn-register">Registrarse</button>

            <p id="reg-error-message" class="error-text" style="display:none;"></p>
            
            <div class="auth-footer">
                <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a></p>
            </div>
        </form>
    </div>

    <script src="js/Register.js"></script>
</body>
</html>
